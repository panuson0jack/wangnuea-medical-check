<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wangnuea Hospital</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Arial,Tahoma,sans-serif;margin:0;background:#f5f8fb;color:#1f2937}header{background:#0b5cab;color:#fff;padding:20px}.w{max-width:1100px;margin:auto;padding:0 15px}.card{background:#fff;border:1px solid #dbe4ec;border-radius:14px;padding:18px;margin:16px 0}input,select,textarea,button{font:inherit;padding:10px;border-radius:8px;border:1px solid #cbd5e1}button{cursor:pointer;font-weight:700}.p{background:#0b5cab;color:#fff;border-color:#0b5cab}.d{background:#fee2e2;color:#991b1b}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.hidden{display:none}.muted{color:#64748b}.ok{background:#dcfce7;color:#166534;padding:10px;border-radius:8px}.bad{background:#fee2e2;color:#991b1b;padding:10px;border-radius:8px}.row{padding:10px 0;border-bottom:1px solid #eee}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><header><div class="w"><h2 style="margin:0">WANGNUEA HOSPITAL</h2><div>ระบบตรวจเช็กความพร้อมใช้งานอุปกรณ์ทางการแพทย์ออนไลน์</div></div></header><main class="w"><section id="login" class="card"><h3>เข้าสู่ระบบ</h3><div class="grid"><label>อีเมล<input id="email" type="email"></label><label>รหัสผ่าน<input id="password" type="password"></label></div><button class="p" onclick="login()" style="margin-top:12px">เข้าสู่ระบบ</button><div id="loginMsg" class="muted" style="margin-top:10px"></div></section><section id="app" class="hidden"><div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><div><b id="user"></b><div id="role" class="muted"></div></div><button onclick="logout()">ออกจากระบบ</button></div></div><div class="card"><h3>ตรวจเช็กอุปกรณ์</h3><div class="grid"><label>ประเภท<select id="type" onchange="loadEquipment()"></select></label><label>เครื่องมือ<select id="equip" onchange="loadChecklist()"></select></label></div><div id="eqInfo" class="muted" style="margin-top:8px"></div><div id="checklist" style="margin-top:12px"></div><div class="grid" style="margin-top:12px"><label>ปัญหา / หมายเหตุ<textarea id="problem"></textarea></label><label>การดำเนินการ<textarea id="action"></textarea></label></div><button class="p" onclick="saveInspection()" style="margin-top:12px">บันทึกผล</button><div id="saveMsg" style="margin-top:10px"></div></div><div class="card"><h3>จัดการ Checklist (Manager/Admin)</h3><div id="managerBox"></div></div><div class="card"><h3>จัดการอุปกรณ์ (Manager/Admin)</h3><div id="equipmentBox"></div></div><div class="card"><h3>ประวัติการตรวจ</h3><button onclick="loadHistory()">รีเฟรช</button><div style="overflow:auto"><table style="width:100%;border-collapse:collapse;margin-top:10px"><thead><tr><th align="left">วันเวลา</th><th align="left">เครื่อง</th><th align="left">ผู้ตรวจ</th><th align="left">สถานะ</th></tr></thead><tbody id="history"></tbody></table></div></div></section></main><script>
const URL='https://uditdhtorygrmrirnzfl.supabase.co';const KEY='sb_publishable_pvuJNfUO9E0cuxWp4xHjOg_8fu8SRLC';const db=supabase.createClient(URL,KEY);let me=null,profile=null,types=[];
const $=x=>document.getElementById(x);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
async function login(){const {data,error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){$('loginMsg').className='bad';$('loginMsg').textContent=error.message;return}me=data.user;await start()}
async function logout(){await db.auth.signOut();location.reload()}
async function start(){$('login').classList.add('hidden');$('app').classList.remove('hidden');const {data:p,error}=await db.from('profiles').select('*').eq('id',me.id).single();if(error){$('saveMsg').className='bad';$('saveMsg').textContent=error.message;return}profile=p;$('user').textContent=p.full_name||me.email;$('role').textContent='สิทธิ์: '+p.role;await loadTypes();await loadHistory()}
async function loadTypes(){const {data,error}=await db.from('device_types').select('id,name').eq('active',true).order('name');if(error)return;$('type').innerHTML=(data||[]).map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');types=data||[];await loadEquipment();renderManager()}
async function loadEquipment(){const id=$('type').value;const {data}=await db.from('equipment').select('*').eq('active',true).eq('device_type_id',id).order('asset_no');$('equip').innerHTML=(data||[]).map(x=>`<option value="${x.id}">${esc(x.asset_no)} - ${esc(x.brand||'')} ${esc(x.model||'')}</option>`).join('');const e=data?.[0];$('eqInfo').textContent=e?`หน่วยงาน: ${e.department||'-'} | สถานที่: ${e.location||'-'} | Serial: ${e.serial_no||'-'}`:'ยังไม่มีเครื่องมือประเภทนี้';await loadChecklist()}
async function loadChecklist(){const id=$('type').value;const {data,error}=await db.from('checklist_items').select('*').eq('active',true).eq('device_type_id',id).order('item_no');if(error){$('checklist').innerHTML=`<div class="bad">${esc(error.message)}</div>`;return}window.items=data||[];$('checklist').innerHTML=window.items.length?window.items.map((x,i)=>`<div class="row"><b>${i+1}. ${esc(x.title)}</b>${x.method?`<div class="muted">${esc(x.method)}</div>`:''}<label><input type="radio" name="q${x.id}" value="ปกติ" onchange="updateResult()"> ปกติ</label><label><input type="radio" name="q${x.id}" value="ผิดปกติ" onchange="updateResult()"> ผิดปกติ</label><label><input type="radio" name="q${x.id}" value="N/A" onchange="updateResult()"> N/A</label></div>`).join(''):'<div class="muted">ยังไม่มี Checklist</div>';updateResult()}
function updateResult(){const n=(window.items||[]).filter(x=>document.querySelector(`input[name=q${x.id}]:checked`)).length;const bad=(window.items||[]).some(x=>document.querySelector(`input[name=q${x.id}]:checked`)?.value==='ผิดปกติ');$('saveMsg').className=n<(window.items||[]).length?'muted':bad?'bad':'ok';$('saveMsg').textContent=n<(window.items||[]).length?`ตรวจแล้ว ${n}/${(window.items||[]).length} ข้อ`:bad?'ผล: ไม่พร้อมใช้งาน':'ผล: พร้อมใช้งาน'}
async function saveInspection(){if(!window.items?.length||!$('equip').value){alert('ยังไม่มีอุปกรณ์หรือ Checklist');return}const ans=window.items.map(x=>({x,v:document.querySelector(`input[name=q${x.id}]:checked`)?.value}));if(ans.some(a=>!a.v)){alert('กรุณาตรวจให้ครบทุกข้อ');return}const status=ans.some(a=>a.v==='ผิดปกติ')?'ไม่พร้อมใช้งาน':'พร้อมใช้งาน';const {data,error}=await db.from('inspections').insert({equipment_id:$('equip').value,inspected_by:me.id,status,problem:$('problem').value.trim(),action:$('action').value.trim()}).select().single();if(error){$('saveMsg').className='bad';$('saveMsg').textContent=error.message;return}const {error:e2}=await db.from('inspection_items').insert(ans.map(a=>({inspection_id:data.id,checklist_item_id:a.x.id,result:a.v})));if(e2){$('saveMsg').className='bad';$('saveMsg').textContent=e2.message;return}$('saveMsg').className=status==='พร้อมใช้งาน'?'ok':'bad';$('saveMsg').textContent='บันทึกผล: '+status;$('problem').value='';$('action').value='';await loadHistory()}
async function loadHistory(){const {data,error}=await db.from('inspections').select('inspected_at,status,equipment(asset_no),profiles(full_name)').order('inspected_at',{ascending:false}).limit(200);$('history').innerHTML=error?`<tr><td>${esc(error.message)}</td></tr>`:(data||[]).map(x=>`<tr><td>${new Date(x.inspected_at).toLocaleString('th-TH')}</td><td>${esc(x.equipment?.asset_no||'-')}</td><td>${esc(x.profiles?.full_name||'-')}</td><td>${esc(x.status)}</td></tr>`).join('')}
async function renderManager(){const can=profile&&['admin','manager'].includes(profile.role);$('managerBox').innerHTML=can?`<div class="grid"><label>ประเภท<select id="mtype">${types.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></label><label>หัวข้อใหม่<input id="mtitle"></label></div><label>วิธีปฏิบัติ<textarea id="mmethod"></textarea></label><button class="p" onclick="addItem()">+ เพิ่ม Checklist</button><div id="mlist" style="margin-top:10px"></div>`:'<div class="muted">ต้องมีสิทธิ์ manager/admin</div>';if(can)await loadManager()}
async function loadManager(){const id=$('mtype').value;const {data}=await db.from('checklist_items').select('*').eq('device_type_id',id).eq('active',true).order('item_no');$('mlist').innerHTML=(data||[]).map(x=>`<div class="row">${x.item_no}. ${esc(x.title)} <button class="d" onclick="delItem('${x.id}')">ลบ</button></div>`).join('')}
async function addItem(){if(!profile||!['admin','manager'].includes(profile.role))return;const id=$('mtype').value,title=$('mtitle').value.trim(),method=$('mmethod').value.trim();if(!title)return;const {data}=await db.from('checklist_items').select('item_no').eq('device_type_id',id).order('item_no',{ascending:false}).limit(1);const no=(data?.[0]?.item_no||0)+1;const {error}=await db.from('checklist_items').insert({device_type_id:id,item_no:no,title,method});if(error)alert(error.message);else{ $('mtitle').value='';$('mmethod').value='';await loadManager();await loadChecklist()}}
async function delItem(id){if(!confirm('ลบ Checklist นี้หรือไม่?'))return;const {error}=await db.from('checklist_items').update({active:false}).eq('id',id);if(error)alert(error.message);else{await loadManager();await loadChecklist()}}
async function renderEquipment(){const can=profile&&['admin','manager'].includes(profile.role);$('equipmentBox').innerHTML=can?'<div class="grid"><label>ประเภท<select id="etype"></select></label><label>รหัสครุภัณฑ์<input id="easset" placeholder="EKG-001"></label><label>ยี่ห้อ<input id="ebrand"></label><label>รุ่น<input id="emodel"></label><label>Serial<input id="eserial"></label><label>หน่วยงาน<input id="edept"></label><label>สถานที่<input id="eloc"></label></div><button class="p" onclick="addEq()">+ เพิ่มอุปกรณ์</button>':'<div class="muted">ต้องมีสิทธิ์ manager/admin</div>';if(can){$('etype').innerHTML=types.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');const old=renderManager;}}
async function addEq(){const v={device_type_id:$('etype').value,asset_no:$('easset').value.trim(),brand:$('ebrand').value.trim(),model:$('emodel').value.trim(),serial_no:$('eserial').value.trim(),department:$('edept').value.trim(),location:$('eloc').value.trim()};if(!v.asset_no)return;const {error}=await db.from('equipment').insert(v);if(error)alert(error.message);else{['easset','ebrand','emodel','eserial','edept','eloc'].forEach(x=>$(x).value='');await loadEquipment()}}
db.auth.getSession().then(async({data})=>{if(data.session){me=data.session.user;await start()}})
</script></body></html>
